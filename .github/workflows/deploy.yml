name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so `git log` can resolve the resume sources' last-change date.
          fetch-depth: 0
      - name: Install Typst 0.15.1
        run: |
          curl --fail --location --silent --show-error https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz --output "$RUNNER_TEMP/typst.tar.xz"
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  $RUNNER_TEMP/typst.tar.xz" | sha256sum --check
          mkdir -p .tools/typst
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" --strip-components=1 -C .tools/typst
      - name: Install pdftotext for the drift check
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 24
      # Runs after the upload, but a failure here still blocks the deploy job.
      - name: Check web page and PDF contain the same data
        run: node scripts/check-drift.ts

  # Builds the blank starter so it keeps matching the schema and both templates.
  starter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Typst 0.15.1
        run: |
          curl --fail --location --silent --show-error https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz --output "$RUNNER_TEMP/typst.tar.xz"
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  $RUNNER_TEMP/typst.tar.xz" | sha256sum --check
          mkdir -p .tools/typst
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" --strip-components=1 -C .tools/typst
      - name: Install pdftotext for the drift check
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm resume:init --yes
      - run: pnpm build
      - run: pnpm check:drift

  deploy:
    needs: [build, starter]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
